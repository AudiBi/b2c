# Services de développement. Lancer avec : npm run docker:up   (lit .env à la racine)
name: b2c

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Super-utilisateur du conteneur = rôle de MIGRATION (propriétaire des tables)
      POSTGRES_USER: b2c_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?lancer npm run setup:env}
      POSTGRES_DB: b2c_dev
      # Mot de passe du rôle APPLICATIF b2c_app (créé par docker/postgres/init/01-roles.sh)
      B2C_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?lancer npm run setup:env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2c_migrator -d b2c_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1035}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025"

  # Optionnel (profil « storage ») : stockage objet compatible S3, utilisé quand STORAGE_DRIVER=s3.
  #   docker compose -f docker/compose.dev.yml --profile storage up -d seaweedfs
  # SeaweedFS (image publique chrislusf/seaweedfs) remplace MinIO, dont l'image n'est plus récupérable.
  # La clé d'accès S3 vient de l'environnement (aucun secret dans le dépôt). Le bucket est créé par npm run s3:init.
  seaweedfs:
    profiles: ["storage"]
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # autoCreateBucket=false : comme AWS S3, écrire dans un bucket absent est une erreur (et non une création silencieuse)
    command: server -dir=/data -filer -s3 -s3.port=8333 -s3.autoCreateBucket=false -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?lancer npm run setup:env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?lancer npm run setup:env}
    ports:
      - "127.0.0.1:${S3_PORT:-9100}:8333"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
